<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123A5E" />
  <title>Điều phối DVC &amp; Tác nghiệp nội bộ</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img class="brand__logo" src="assets/icon.svg" alt="" aria-hidden="true" />
      <div class="brand__text">
        <h1 class="brand__title">DVC <span class="brand__accent">mini</span></h1>
      </div>
    </div>

    <div class="topbar__right">
      <div class="sync" id="syncIndicator" role="status" aria-live="polite">
        <span class="sync__dot" id="syncDot"></span>
        <span class="sync__text">Đồng bộ <span id="syncAgo">0s</span> trước</span>
      </div>
      <time class="clock" id="clock" datetime="">00:00:00</time>
      <button class="iconbtn" id="refreshBtn" type="button" aria-label="Làm mới dữ liệu" title="Làm mới">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng/tối" title="Giao diện">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="controlbar">
    <div class="controlbar__inner">
      <nav class="tabs" role="tablist" aria-label="Chọn nhóm dữ liệu">
        <button class="tabs__btn is-active" id="tabDVC" role="tab" aria-selected="true" type="button" title="Phím tắt: 1">
          <span>Dịch vụ công</span>
          <span class="tabs__count" id="countDVC">0</span>
        </button>
        <button class="tabs__btn" id="tabTN" role="tab" aria-selected="false" type="button" title="Phím tắt: 2">
          <span>Tác nghiệp nội bộ</span>
          <span class="tabs__count" id="countTN">0</span>
        </button>
      </nav>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" autocomplete="off"
               placeholder="Tìm mã, tên thủ tục, lĩnh vực…" aria-label="Tìm kiếm" />
        <kbd class="search__kbd">/</kbd>
      </div>

      <div class="filters">
        <select id="filterCategory" class="select" aria-label="Lọc theo lĩnh vực / nhóm hệ thống"></select>
        <select id="filterStatus" class="select" aria-label="Lọc theo mức độ trực tuyến / trạng thái"></select>
        <button class="iconbtn iconbtn--ghost" id="resetBtn" type="button" title="Xoá tìm kiếm và bộ lọc (Esc)" aria-label="Xoá tìm kiếm và bộ lọc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="metaline">
      <p class="resultcount" id="resultCount" aria-live="polite"></p>
      <div class="chips" id="activeChips"></div>
    </div>

    <section class="listwrap">
      <div class="list" id="listContainer"></div>
      <div class="empty" id="emptyState" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
        <p class="empty__title">Không tìm thấy kết quả phù hợp</p>
        <p class="empty__hint">Thử đổi từ khoá tìm kiếm hoặc bỏ bớt bộ lọc đang áp dụng.</p>
        <button class="btn" id="clearFiltersBtn" type="button">Xoá toàn bộ bộ lọc</button>
      </div>
    </section>
  </main>

  <footer class="hintbar">
    <span><kbd>/</kbd> tìm kiếm</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> chọn dòng</span>
    <span><kbd>Enter</kbd> mở hệ thống</span>
    <span><kbd>⇧</kbd><kbd>Enter</kbd> chi tiết</span>
    <span><kbd>C</kbd> sao chép mã</span>
    <span><kbd>1</kbd><kbd>2</kbd> đổi tab</span>
    <span><kbd>Esc</kbd> đóng / xoá lọc</span>
  </footer>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
      <div class="drawer__head">
        <span class="badge" id="drawerCode">—</span>
        <button class="iconbtn" id="drawerClose" type="button" aria-label="Đóng (Esc)" title="Đóng (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <h2 class="drawer__title" id="drawerTitle">—</h2>
      <div class="drawer__actions" id="drawerActions"></div>
      <dl class="drawer__meta" id="drawerMeta"></dl>
      <div id="drawerExtra"></div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
